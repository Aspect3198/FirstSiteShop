<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ShopX - Інтернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>
    <div class="top-bar">
        <h1 class="logo">ShopX</h1>

        <input type="text" placeholder="Пошук товарів..." class="search">

        <div class="user-menu">
            <a href="#">Увійти</a>
            <a href="#">Кошик (0)</a>
        </div>
    </div>

    <nav class="menu">
        <a href="#">Смартфони</a>
        <a href="#">Ноутбуки</a>
        <a href="#">Аксесуари</a>
        <a href="#">Побутова техніка</a>
    </nav>
</header>

<!-- BANNER -->
<section class="banner">
    <h2>Знижки до -50% 🔥</h2>
    <p>Тільки сьогодні на всі гаджети</p>
</section>

<!-- PRODUCTS -->
<main>

<h2>Популярні товари</h2>

<div class="products">

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>iPhone 14</h3>
        <p class="price">35000 грн</p>
        <button>Додати в кошик</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>Samsung Galaxy</h3>
        <p class="price">28000 грн</p>
        <button>Додати в кошик</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>MacBook Air</h3>
        <p class="price">45000 грн</p>
        <button>Додати в кошик</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/200">
        <h3>Навушники Sony</h3>
        <p class="price">3000 грн</p>
        <button>Додати в кошик</button>
    </div>

</div>

</main>

<!-- FOOTER -->
<footer>
    <p>© 2026 ShopX | Всі права захищені</p>
</footer>

</body>
</html>
